name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of racing the older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and upload in one job, deploy in another (GitHub's recommended
  # layout). The deploy job only starts once the artifact is fully registered,
  # and re-running a failed deploy doesn't upload a second "github-pages"
  # artifact (which makes deploy-pages fail with "Multiple artifacts").
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned so CI resolves the dependency tree exactly as local dev does.
      - name: Pin npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
